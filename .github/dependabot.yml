---
version: 2

updates:
  # The ``uv`` ecosystem updates ``pyproject.toml`` and ``uv.lock``
  # together, keeping the lockfile in sync so that
  # ``uv sync --locked`` in the Dockerfile keeps working.
  - package-ecosystem: uv
    allow:
      - dependency-type: all
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

  # Dependabot cannot read prek.toml yet:
  # https://github.com/dependabot/dependabot-core/issues/14624
