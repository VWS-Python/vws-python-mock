---
name: Contract package

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
      - name: Verify installed contracts through the Flask adapter
        run: ci/check_contract_package.sh
        env:
          UV_PYTHON: '3.15'
