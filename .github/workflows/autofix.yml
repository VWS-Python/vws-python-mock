---
name: autofix.ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Run fixers
        uses: j178/prek-action@v3.0.0
        with:
          prek-version: 0.4.11
          extra-args: >-
            --all-files
            --hook-stage pre-commit
            --no-fail-fast
            --verbose
        env:
          UV_NO_CACHE: '1'
          UV_PYTHON: '3.14'

      - uses: autofix-ci/action@v1.3.4
        if: always()
