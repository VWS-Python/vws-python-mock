[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools" ]

[project]
name = "vws-mock-contract-tests"
version = "0.0.0"
description = "Shared Vuforia Web Services API contract tests."
readme = "README.rst"
license = "MIT"
license-files = [ "LICENSE" ]
authors = [ { name = "Adam Dangoor", email = "adamdangoor@gmail.com" } ]
requires-python = ">=3.15"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "beartype>=0.23.1",
  "dirty-equals>=0.11",
  "freezegun>=1.5.5",
  "pydantic>=2.6",
  "pytest>=9.1.1",
  "pytest-retry>=1.7",
  "requests>=2.32.3",
  "tenacity>=9.2.1",
  "tzdata; sys_platform>='win32'",
  "urllib3>=2.8",
  "vws-auth-tools>=2024.7.12",
  "vws-python>=2026.10.9",
]
urls.Source = "https://github.com/VWS-Python/vws-python-mock"

[tool.setuptools]
packages.find.where = [ "src" ]
package-data.vws_mock_contract_tests = [ "py.typed" ]
