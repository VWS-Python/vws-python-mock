[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools" ]

[project]
name = "vws-python-mock-server"
version = "0.0.0"
description = "Flask services for the Vuforia Web Services mock."
readme = "README.rst"
license = "MIT"
license-files = [ "LICENSE" ]
authors = [ { name = "Adam Dangoor", email = "adamdangoor@gmail.com" } ]
requires-python = ">=3.15"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "beartype>=0.23.1",
  "flask>=3.0.3",
  "pydantic>=2.6",
  "pydantic-settings>=2.6.1",
  "requests>=2.32.3",
  "vws-python-mock",
  "werkzeug>=3.1.2",
]
urls.Source = "https://github.com/VWS-Python/vws-python-mock"

[tool.setuptools]
packages.find.where = [ "src" ]
package-data.vws_mock_server = [ "py.typed" ]
